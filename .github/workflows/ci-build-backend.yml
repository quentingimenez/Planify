name: Backend - docker image

on:
  workflow_run:
    workflows: ["Backend - tests"]
    branches: ["main"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'packages/backend/**'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}

  build_and_push:
    runs-on: ubuntu-latest
    needs: [changes]
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable Corepack and install Yarn 4.10.3
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate

      - name: Compute version and timestamp
        id: vars
        shell: bash
        run: |
          VERSION="1.$(git rev-list --count HEAD)"
          TIMESTAMP="$(date +'%Y%m%d%H')"
          # GHCR exige un nom d'image en minuscules
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/planify_backend"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"
          echo "tags=${IMAGE}:${TIMESTAMP}-v${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push (Buildx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
